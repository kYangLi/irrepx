name: Publish to PyPI

# Fires when a release is *published* (not when the draft is created), so the
# draft is the review gate: nothing reaches PyPI until a human presses Publish.
#
# Uses PyPI Trusted Publishing -- no API token is stored anywhere. The PyPI-side
# publisher must stay configured as:
#   owner kYangLi, repo irrepx, workflow publish.yaml, environment pypi-publish
on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.13"

      - name: Build package with uv
        run: |
          uv build --sdist --wheel -o dist ./

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
