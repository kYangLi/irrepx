name: Release

# Pushing a `v*` tag builds the wheel and opens a DRAFT release with it
# attached. Nothing is published from here -- the draft is reviewed and
# published by hand, and publishing it is what fires publish.yaml (PyPI).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Build wheel and open a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate tag matches pyproject.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag version      : ${tag_version}"
          echo "pyproject version: ${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build wheel
        run: |
          set -euo pipefail
          pip install build
          python -m build --wheel -o dist .
          ls -l dist

      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from irrepx import Irrep, Irreps
          assert Irreps('32x0e + 16x1o + 8x2e').dim == 120
          assert Irrep('2e') in Irrep('1o') * Irrep('1o')
          print('[smoke] ok')
          "

      - name: Open a draft release with the wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f .github/RELEASE_NOTES.md ]; then
            notes=(--notes-file .github/RELEASE_NOTES.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${notes[@]}" \
            dist/*.whl
