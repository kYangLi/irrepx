[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "irrepx"
version = "1.0.0"
authors = [
    {name = "DeepH team", email = "deeph-pack@outlook.com"},
]
description = "Minimal O(3) irreducible representations. A lightweight, dependency-free irreps algebra."
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = [
    "irreps", "irreducible representations", "O(3)", "SO(3)",
    "equivariance", "symmetry", "physics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0,<0.16",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/kYangLi/irrepx"
Documentation = "https://github.com/kYangLi/irrepx#readme"
Repository = "https://github.com/kYangLi/irrepx.git"
Issues = "https://github.com/kYangLi/irrepx/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["irrepx*"]
exclude = [
    "tests*", "docs*", "examples*", ".*",
    "*.egg-info", "build*", "Makefile",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]
